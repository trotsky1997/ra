[package]
name = "ra"
version = "0.1.0"
edition = "2021"
description = "Ra — rust-native agent. Sun god, illuminating tools."

[lib]
name = "ra"
path = "src/lib.rs"

[[bin]]
name = "ra"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "io-std", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
llm = { version = "1.2", default-features = false, features = ["openai", "anthropic", "google", "deepseek", "ollama", "groq", "xai"] }
agent-client-protocol = { git = "https://github.com/trotsky1997/rust-sdk.git", branch = "feat/unstable-feature-passthrough", features = ["unstable"] }
dashmap = "6"
clap = { version = "4", features = ["derive"] }
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "5"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
tiktoken-rs = "0.11"
nemo-relay = { git = "https://github.com/NVIDIA/NeMo-Relay.git", branch = "main" }
a2a-lf = { git = "https://github.com/a2aproject/a2a-rs.git", rev = "7676ec9f2ef53a0daafb08d8ea0d4436e3075078" }
a2a-server-lf = { git = "https://github.com/a2aproject/a2a-rs.git", rev = "7676ec9f2ef53a0daafb08d8ea0d4436e3075078" }
a2a-client-lf = { git = "https://github.com/a2aproject/a2a-rs.git", rev = "7676ec9f2ef53a0daafb08d8ea0d4436e3075078" }
a2a-grpc = { git = "https://github.com/a2aproject/a2a-rs.git", rev = "7676ec9f2ef53a0daafb08d8ea0d4436e3075078" }
a2a-pb = { git = "https://github.com/a2aproject/a2a-rs.git", rev = "7676ec9f2ef53a0daafb08d8ea0d4436e3075078" }
axum = "0.8"
tonic = "0.14"
tokio-util = { version = "0.7", features = ["rt"] }
