[package]
name = "ra"
version = "0.1.0"
edition = "2021"
description = "Ra — rust-native agent. Sun god, illuminating tools."
license = "MIT"
repository = "https://github.com/trotsky1997/ra"
homepage = "https://github.com/trotsky1997/ra"
readme = "README.md"
keywords = ["agent", "llm", "acp", "a2a", "mcp"]
categories = ["command-line-utilities"]

[lib]
name = "ra"
path = "src/lib.rs"

[[bin]]
name = "ra"
path = "src/main.rs"

[[bin]]
name = "gen-schema"
path = "src/bin/gen-schema.rs"

[features]
default = []
# Interactive TUI runtime (`ra tui`). Requires nightly Rust because
# opentui_rust uses edition 2024. Stable builds with the default
# feature set keep working unchanged.
tui = ["dep:opentui_rust"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "io-std", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# a2a-rs ecosystem (a2a-client / a2a-server) is on reqwest 0.13 — alias the
# matching version under a separate name so we can hand-build clients that
# their transport factories accept (Authorization headers etc.) without
# breaking llm/nemo-relay which still pin 0.12.
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
llm = { version = "1.2", default-features = false, features = ["openai", "anthropic", "google", "deepseek", "ollama", "groq", "xai"] }
agent-client-protocol = { git = "https://github.com/trotsky1997/rust-sdk.git", branch = "feat/unstable-feature-passthrough", features = ["unstable"] }
dashmap = "6"
clap = { version = "4", features = ["derive"] }
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "5"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
tiktoken-rs = "0.11"
toml = "0.8"
serde_yaml = "0.9"
regex = "1"
rmcp = { version = "1.7", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
globset = "0.4"
ignore = "0.4"
shellexpand = "3"
nemo-relay = { git = "https://github.com/NVIDIA/NeMo-Relay.git", branch = "main" }
a2a-lf = { git = "https://github.com/a2aproject/a2a-rs.git", rev = "7676ec9f2ef53a0daafb08d8ea0d4436e3075078" }
a2a-server-lf = { git = "https://github.com/a2aproject/a2a-rs.git", rev = "7676ec9f2ef53a0daafb08d8ea0d4436e3075078" }
a2a-client-lf = { git = "https://github.com/a2aproject/a2a-rs.git", rev = "7676ec9f2ef53a0daafb08d8ea0d4436e3075078" }
a2a-grpc = { git = "https://github.com/a2aproject/a2a-rs.git", rev = "7676ec9f2ef53a0daafb08d8ea0d4436e3075078" }
a2a-pb = { git = "https://github.com/a2aproject/a2a-rs.git", rev = "7676ec9f2ef53a0daafb08d8ea0d4436e3075078" }
axum = "0.8"
tonic = "0.14"
tokio-util = { version = "0.7", features = ["rt"] }
which = "6"
opentui_rust = { git = "https://github.com/Dicklesworthstone/opentui_rust", rev = "e68d81b0a3ae35c15b916d0c2849e9d6dbf09b2c", optional = true }
libc = "0.2"
