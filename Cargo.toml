[package]
name = "ra"
version = "0.1.0"
edition = "2021"
description = "Ra — rust-native agent. Sun god, illuminating tools."

[lib]
name = "ra"
path = "src/lib.rs"

[[bin]]
name = "ra"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "io-std", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
llm = { version = "1.2", default-features = false, features = ["openai", "anthropic", "google", "deepseek", "ollama", "groq", "xai"] }
agent-client-protocol = { version = "0.12", features = ["unstable"] }
dashmap = "6"
clap = { version = "4", features = ["derive"] }
ulid = "1"
tokio-util = { version = "0.7", features = ["rt"] }
